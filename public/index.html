<!DOCTYPE html>
<html lang="en" style="-webkit-spatial-navigation: none;">
  <head>
    <meta charset="utf-8" />

    <!-- webOS TV viewport — use device native resolution for sharp text -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />

    <!-- Theme -->
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="BBNL IPTV — LG Smart TV" />

    <!-- PWA manifest (optional, harmless on TV) -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <title>BBNL IPTV</title>

    <style>
      /* ── Reset for webOS TV ──────────────────────────────────────────────── */
      *, *::before, *::after { box-sizing: border-box; }

      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
        -webkit-text-size-adjust: none;
        font-family: 'LG Display GP4', 'LG Smart UI', Roboto, 'Segoe UI', sans-serif;
        text-rendering: optimizeSpeed;
        -webkit-font-smoothing: subpixel-antialiased;
        font-weight: 500;
      }

      #root {
        width: 100%;
        height: 100%;
        position: relative;
      }

      /* ── NUCLEAR: Kill ALL native focus/outline/border on every element ── */
      *, *:focus, *:focus-visible, *:focus-within, *:active {
        outline: none !important;
        outline-width: 0 !important;
        outline-style: none !important;
        outline-color: transparent !important;
        -webkit-tap-highlight-color: transparent !important;
        -webkit-focus-ring-color: transparent !important;
      }
      button::-webkit-focus-inner { border: 0; padding: 0; }

      /* Prevent tap-highlight on webOS */
      * { -webkit-tap-highlight-color: transparent; }

      /* backface-visibility removed — it causes blurry text on TV screens */

      /* ── Hide scrollbar (TV apps should never show scrollbars) ─────── */
      .hide-scrollbar { scrollbar-width: none; -ms-overflow-style: none; }
      .hide-scrollbar::-webkit-scrollbar { display: none; width: 0; height: 0; }

      /* ── TV DOM Focus Engine ─────────────────────────────────────────── */
      /* Focus/hover applied via DOM attribute manipulation — zero React re-renders */

      /* NO transition on focusable items — instant response on LG webOS */
      [class^="focusable-"],
      [class*=" focusable-"] {
        outline: none;
      }

      /* Sidebar channel items — border only, no background */
      .focusable-sidebar-item[data-focused="true"] {
        background-color: transparent !important;
        border: 2px solid #60a5fa !important;
        outline: none !important;
      }

      /* Category tabs */
      .focusable-category-tab[data-focused="true"] {
        border: 2px solid #60a5fa !important;
        outline: none !important;
      }

      /* Language cards — no transform to keep text sharp on TV */
      .focusable-language-card[data-focused="true"] {
        border: 4px solid rgba(255,255,255,0.9) !important;
      }
      .focusable-language-card[data-hovered="true"]:not([data-focused="true"]) {
        border: 3px solid rgba(255,255,255,0.3) !important;
      }

      /* Generic buttons (category tabs, OTT, etc.) — no transform to keep text sharp */
      .focusable-button[data-focused="true"] {
        border: 3px solid #fff !important;
        box-shadow: none !important;
      }
      .focusable-button[data-hovered="true"]:not([data-focused="true"]) {
        border: 3px solid rgba(255,255,255,0.3) !important;
      }

      /* OTT app cards (Home APPS row) — border + brightness, no transform */
      .focusable-ott-app[data-focused="true"] {
        border: 3px solid #fff !important;
        filter: brightness(1.15) !important;
        box-shadow: none !important;
      }
      .focusable-ott-app[data-hovered="true"]:not([data-focused="true"]) {
        border: 3px solid rgba(255,255,255,0.3) !important;
      }

      /* Input / textarea */
      .focusable-input[data-focused="true"] {
        border: 3px solid #667eea !important;
      }

      /* Icon buttons (home sidebar icons) — focus = red tint */
      .focusable-icon-button[data-focused="true"] {
        background: rgba(236,25,70,0.25) !important;
        color: #EC1946 !important;
        border: 2px solid #EC1946 !important;
        border-radius: 14px !important;
      }
      .focusable-icon-button[data-hovered="true"]:not([data-focused="true"]) {
        background: rgba(255,255,255,0.06) !important;
        color: #aaa !important;
      }

      /* Settings menu items — no transform */
      .focusable-settings-item[data-focused="true"] {
        border: 3px solid #667eea !important;
      }
      .focusable-settings-item[data-logout="true"][data-focused="true"] {
        border: 3px solid #f44336 !important;
      }

      /* Settings — Software Update "Check" button */
      .focusable-check-btn[data-focused="true"] {
        border: 3px solid #fff !important;
        background: rgba(255,255,255,0.12) !important;
      }

      /* Settings — Update Mobile Number "Request Update" button */
      .focusable-mobile-update-btn[data-focused="true"] {
        border: 3px solid #fff !important;
        background: rgba(255,255,255,0.12) !important;
      }

      /* Settings — Help & Support textarea + submit (TV-safe: border + brightness, no transforms) */
      .focusable-support-textarea[data-focused="true"] {
        border: 3px solid #fff !important;
        background: rgba(255,255,255,0.08) !important;
        filter: brightness(1.05) !important;
      }
      .focusable-support-submit[data-focused="true"] {
        border: 3px solid #fff !important;
        background: rgba(255,255,255,0.12) !important;
        filter: brightness(1.1) !important;
      }

      /* Settings — Manage Users input + submit (TV-safe: border + brightness, no transforms) */
      .focusable-users-input[data-focused="true"] {
        border: 3px solid #fff !important;
        background: rgba(255,255,255,0.08) !important;
        filter: brightness(1.05) !important;
      }
      .focusable-users-submit[data-focused="true"] {
        border: 3px solid #fff !important;
        background: rgba(255,255,255,0.12) !important;
        filter: brightness(1.1) !important;
      }

      /* Settings — Logout dialog buttons */
      .focusable-dialog-cancel[data-focused="true"] {
        border: 3px solid #fff !important;
        background: rgba(255,255,255,0.1) !important;
        transform: scale(1.04);
      }
      .focusable-dialog-logout[data-focused="true"] {
        border: 3px solid #fff !important;
        background: #d32f2f !important;
        transform: scale(1.04);
      }
      @media (prefers-reduced-motion: reduce) {
        .focusable-dialog-cancel[data-focused="true"],
        .focusable-dialog-logout[data-focused="true"] { transform: none; }
      }

      /* Settings — Toast (slides down from top) */
      @keyframes _toastIn {
        from { transform: translate(-50%, -120%); opacity: 0; }
        to   { transform: translate(-50%, 0); opacity: 1; }
      }
      .bbnl-toast {
        position: fixed;
        top: 24px;
        left: 50%;
        transform: translate(-50%, 0);
        background: rgba(15,23,42,0.95);
        color: #fff;
        padding: 14px 28px;
        border-radius: 10px;
        font-size: 18px;
        font-weight: 600;
        box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        border: 1px solid rgba(255,255,255,0.15);
        z-index: 10002;
        animation: _toastIn 0.22s ease-out;
      }
      @media (prefers-reduced-motion: reduce) {
        .bbnl-toast { animation: none; }
      }

      /* Channel number pad keys — overlay so scale is OK here */
      .focusable-numpad-key[data-focused="true"] {
        border: 2px solid #667eea !important;
        transform: scale(1.06);
      }
      @media (prefers-reduced-motion: reduce) {
        .focusable-numpad-key[data-focused="true"] { transform: none; }
      }

      /* ChannelNotFound OK button */
      .focusable-error-ok[data-focused="true"] {
        border: 2px solid #fff !important;
      }

      /* ChannelLocked modal OK button */
      .focusable-locked-ok:focus,
      .focusable-locked-ok[data-focused="true"] {
        border: 2px solid #fff !important;
        background: #5163ed !important;
        box-shadow: 0 0 0 4px rgba(91,124,250,0.35);
      }

      /* Language tabs (second row in player sidebar) */
      .focusable-language-tab[data-focused="true"] {
        border: 2px solid #60a5fa !important;
        outline: none !important;
      }

      /* Feedback page — zoned focus styles */
      .focusable-feedback-back[data-focused="true"]    { border: 3px solid #667eea !important; background: rgba(102,126,234,0.1) !important; }
      .focusable-feedback-star[data-focused="true"]    { border-color: #667eea !important; background: rgba(102,126,234,0.12) !important; }
      .focusable-feedback-textarea[data-focused="true"]{ border: 3px solid #667eea !important; background: rgba(102,126,234,0.05) !important; }
      .focusable-feedback-button[data-focused="true"]  { border: 3px solid #fff !important; }

      /* Favorites page — Go to home button focus */
      .focusable-fav-btn[data-focused="true"] {
        background: #fff !important;
        border: 4px solid #f4bf1f !important;
        box-shadow: 0 0 0 6px rgba(244,191,31,0.3) !important;
      }

      /* Tap acknowledgement — applied via useTapAction (120ms flash) and by
         useMagicRemote on OK-key activations. Static colors only — no transform. */
      .focusable-button[data-pressed="true"],
      .focusable-sidebar-item[data-pressed="true"],
      .focusable-language-card[data-pressed="true"],
      .focusable-category[data-pressed="true"],
      .focusable-channel-tile[data-pressed="true"],
      [data-pressed="true"].focusable {
        border-color: #ffd700 !important;
        background: rgba(255, 215, 0, 0.18) !important;
      }

      /* Submit-button in-flight state — applied to forms in Settings while a
         network request is pending. */
      [data-disabled="true"] {
        opacity: 0.5 !important;
        pointer-events: none !important;
      }

      /* ── BBNL Splash Screen — Netflix-style premium intro ────────────────
         Pure black backdrop; only the logo on screen. The logo arrives with a
         soft scale+fade, breathes subtly while React boots, then dissolves
         outward as the app paints in. transform/opacity only. */
      #bbnl-splash {
        position: fixed; inset: 0; z-index: 99999;
        background: #000;
        display: flex; align-items: center; justify-content: center;
        opacity: 1;
        will-change: opacity;
      }
      #bbnl-splash.bbnl-splash-hide {
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.40s cubic-bezier(0.22, 1, 0.36, 1);
      }
      #bbnl-splash.bbnl-splash-hide .bbnl-splash-logo {
        transform: scale(1.08);
        transition: transform 0.40s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .bbnl-splash-logo {
        /* 28% of viewport height — matches splash.png exactly so the OS→HTML
           handoff has zero visible jump.  width auto preserves icon aspect. */
        height: 28vh; width: auto;
        max-width: 36vw;
        display: block;
        opacity: 0;
        transform: scale(0.94);
        animation:
          bbnl-logo-in 0.85s cubic-bezier(0.22, 1, 0.36, 1) 0.05s forwards,
          bbnl-logo-breathe 4.8s ease-in-out 0.95s infinite;
        will-change: transform, opacity;
      }
      @keyframes bbnl-logo-in {
        0%   { opacity: 0;    transform: scale(0.94); }
        60%  { opacity: 1; }
        100% { opacity: 1;    transform: scale(1);    }
      }
      @keyframes bbnl-logo-breathe {
        0%, 100% { transform: scale(1);     }
        50%      { transform: scale(1.018); }
      }
      @media (prefers-reduced-motion: reduce) {
        .bbnl-splash-logo {
          animation: none;
          opacity: 1;
          transform: none;
        }
      }
    </style>

    <!--
      CRITICAL — webOSTV.js must be loaded SYNCHRONOUSLY before React boots.
      Using a LOCAL copy (./webOSTV.js) so the app works even when the TV
      has no internet access.  On a real LG TV, window.webOS already exists
      and the stub inside webOSTV.js skips itself automatically.
    -->
    <script src="%PUBLIC_URL%/webOSTV.js"></script>
  </head>

  <body>
    <noscript>JavaScript must be enabled to run BBNL IPTV.</noscript>

    <!--
      BBNL Splash (Netflix-style) — paints instantly (before the React bundle loads) so
      there's no black flash on launch. Hidden by App.js once mounted, or
      by the safety-ceiling timer (2.5s) below if the bundle ever hangs.
    -->
    <div id="bbnl-splash" aria-hidden="true">
      <img class="bbnl-splash-logo" src="%PUBLIC_URL%/icons.png" alt="BBNL" />
    </div>

    <div id="root"></div>

    <script>
      (function () {
        var hidden = false;
        function hide() {
          if (hidden) return; hidden = true;
          var s = document.getElementById('bbnl-splash');
          if (!s) return;
          s.classList.add('bbnl-splash-hide');
          setTimeout(function () { if (s && s.parentNode) s.parentNode.removeChild(s); }, 450);
        }
        window.__BBNL_HIDE_SPLASH__ = hide;
        setTimeout(hide, 3500); // safety ceiling — bundle hang
      })();
    </script>
  </body>
</html>
